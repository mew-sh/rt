[package]
name = "rustun"
version = "0.1.0"
edition = "2021"
description = "A multi-protocol security tunnel written in Rust, ported from gost"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mew-sh/rustun"
keywords = ["proxy", "tunnel", "socks5", "http-proxy", "port-forwarding"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
rand = "0.8"
glob-match = "0.2"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
http = "1"
httparse = "1"
url = "2"
pin-project-lite = "0.2"
# SSH support (russh used internally by ssh module)
# russh = "0.49" -- available but not imported directly yet
# QUIC support
quinn = "0.11"
# The TLS listener uses rustls rather than native-tls: it is pure Rust, so the
# server identity is built the same way on every platform. native-tls delegates
# to schannel on Windows, which cannot build an identity from a PEM key pair.
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
# HTTP/2 support
h2 = "0.4"
# Shadowsocks cipher support
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha1 = "0.10"
md5 = "0.7"
bytes = "1"
rcgen = "0.13"
openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
default = []
vendored-openssl = ["openssl"]

[profile.release]
# Cross-crate inlining matters here: the hot path is a chain of thin wrappers
# (ProxyConn -> SsStream/WsStream/MuxStream -> the socket), each a separate
# crate-local poll_read/poll_write that only pays off once it can be inlined
# through. Thin LTO rather than fat keeps the link within this machine's memory.
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
# Needed by the TLS transport integration tests, which drive a real native-tls
# client against the rustls listener. Integration tests cannot reach the
# crate's own dependencies. Using a different TLS stack on each side also makes
# the test cross-implementation rather than self-consistent.
native-tls = "0.2"
tokio-native-tls = "0.3"
rcgen = "0.13"
