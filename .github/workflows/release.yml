name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rt

jobs:
  # --------------------------------------------------------------------------
  # Run the full test suite before building release artifacts
  # --------------------------------------------------------------------------
  test:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships binaries reporting a
      # different version than the release they are attached to.
      - name: Verify tag matches Cargo.toml version
        run: |
          MANIFEST="$(cargo metadata --format-version=1 --no-deps             | jq -r '.packages[] | select(.name == "rt") | .version')"
          EXPECTED="v${MANIFEST}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${EXPECTED}). Bump Cargo.toml or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches Cargo.toml version ${EXPECTED}."

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all --locked --verbose

  # --------------------------------------------------------------------------
  # Build release binaries for all targets
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux ---
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true

          # --- macOS ---
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # --- Windows ---
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: i686-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip

          # --- FreeBSD (cross-compiled from Linux) ---
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            archive: tar.gz
            cross: true

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Install OpenSSL dev headers for cross targets on the host
      - name: Install cross-compilation dependencies
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev perl make

      # Cross-compilation tool for non-native targets
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Native build
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Cross build with vendored OpenSSL (compiles OpenSSL from source
      # so we do not need target-arch system headers)
      - name: Build (cross)
        if: matrix.cross
        env:
          OPENSSL_STATIC: "1"
          CROSS_CONFIG: Cross.toml
        run: cross build --release --locked --target ${{ matrix.target }} --features vendored-openssl

      # --- Package: tar.gz (Linux, macOS, FreeBSD) ---
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          tar czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> "$GITHUB_ENV"

      # --- Package: zip (Windows) ---
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          7z a "$STAGING.zip" "$STAGING"
          echo "ASSET=$STAGING.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.ASSET }}

  # --------------------------------------------------------------------------
  # Build Docker image and push to GHCR
  # --------------------------------------------------------------------------
  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # --------------------------------------------------------------------------
  release:
    name: Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        working-directory: artifacts
        run: |
          # Name the archives explicitly: the redirection creates
          # SHA256SUMS.txt before the glob expands, so `*` would hash it too.
          sha256sum ${{ env.BINARY_NAME }}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify every published asset is checksummed
        working-directory: artifacts
        run: |
          status=0
          for f in ${{ env.BINARY_NAME }}-*; do
            if ! grep -q "  ${f}\$" SHA256SUMS.txt; then
              echo "::error::Asset ${f} is missing from SHA256SUMS.txt"
              status=1
            fi
          done
          exit "${status}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
